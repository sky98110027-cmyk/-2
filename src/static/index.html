<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>결 — 영상의 결을 스킬로</title>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>

<header class="top">
  <h1>결 <span class="sub">영상 한 편의 결을 스킬로 만들어 둡니다</span></h1>
  <div id="status" class="status">확인 중…</div>
</header>

<nav class="tabs" role="tablist">
  <button class="tab on" data-tab="step1">1. 결 뽑기</button>
  <button class="tab" data-tab="step2">2. 내 결</button>
  <button class="tab" data-tab="step3">3. 대본 만들기</button>
</nav>

<main>

<!-- ------------------------------------------------ 1단계 -->
<section id="step1" class="panel on">
  <p class="lead">
    본받고 싶은 영상 링크를 넣어주세요.<br>
    그 영상이 이야기를 밀고 가는 방식을 뜯어서 정리해드립니다.
  </p>

  <label class="field">
    <span>영상 링크</span>
    <input id="a-url" type="url" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off">
  </label>

  <details class="fold">
    <summary>자막이 안 잡히면 여기에 대본을 붙여넣으세요</summary>
    <label class="field">
      <span>영상 제목 (선택)</span>
      <input id="a-title" type="text" placeholder="봉오동 전투, 그날의 기록">
    </label>
    <label class="field">
      <span>대본 전문</span>
      <textarea id="a-transcript" rows="8" placeholder="영상에서 말한 내용을 그대로 붙여넣어주세요."></textarea>
    </label>
  </details>

  <label class="field">
    <span>화면에 관한 메모 <em>(자막에 안 잡히는 것)</em></span>
    <textarea id="a-notes" rows="3" placeholder="예: 흑백 사진 위주에 세피아 톤, 자막은 화면 아래 한 줄만, 배경음은 낮은 현악기"></textarea>
  </label>

  <button id="a-go" class="big">결 뽑기</button>

  <div id="a-out" class="out"></div>
</section>

<!-- ------------------------------------------------ 2단계 -->
<section id="step2" class="panel">
  <p class="lead">저장해 둔 결입니다. 하나를 고르면 3단계에서 그 결로 대본을 씁니다.</p>
  <div id="s-list" class="cards"></div>
</section>

<!-- ------------------------------------------------ 3단계 -->
<section id="step3" class="panel">
  <p class="lead">결을 고르고 주제만 넣으면 됩니다. 주제가 달라져도 결은 그대로 갑니다.</p>

  <label class="field">
    <span>어떤 결로</span>
    <select id="p-skill"></select>
  </label>

  <label class="field">
    <span>이번 영상 주제</span>
    <input id="p-topic" type="text" placeholder="예: 김좌진 장군과 청산리, 또는 사흘을 굶고도 총을 놓지 않은 이유">
  </label>

  <label class="field">
    <span>목표 길이</span>
    <select id="p-min">
      <option value="1">1분 (쇼츠)</option>
      <option value="3">3분</option>
      <option value="5" selected>5분</option>
      <option value="8">8분</option>
      <option value="12">12분</option>
      <option value="20">20분</option>
    </select>
  </label>

  <label class="field">
    <span>이번에만 따로 부탁할 것 (선택)</span>
    <textarea id="p-notes" rows="3" placeholder="예: 유족 인터뷰를 넣을 자리를 중간에 비워둘 것"></textarea>
  </label>

  <button id="p-go" class="big">대본 만들기</button>

  <div id="p-out" class="out"></div>
</section>

</main>

<div id="toast" class="toast"></div>
<script src="/static/app.js"></script>
</body>
</html>
